<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Levi OS</title>
<meta name="description" content="Levi OS — control your reality." />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#000000" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Levi OS" />
<meta name="mobile-web-app-capable" content="yes" />

<style>
  html, body { margin: 0; padding: 0; background: #000000; }
  #root { min-height: 100vh; }
</style>

<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div id="root"></div>

<!-- ?v= busts any old cached copy on devices that had the previous service worker -->
<script src="config.js"></script>
<script src="bundle.js?v=16"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
